<!DOCTYPE html>
<html lang="en">
<head>
<!--H0-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Political Map of the Nations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Spectral+SC:wght@500;600;700&amp;family=Spectral:ital,wght@0,400;0,600;1,400&amp;family=IBM+Plex+Sans+Condensed:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed atlas on an ink desk; detail sheet docks right (desktop) or slides up from the bottom (phone) */
  --ink:#121822;--ink-2:#1b2330;--ink-3:#232d3d;--rule:#2b3547;
  --text:#e8eaef;--muted:#97a0b2;--accent:#e2b04a;--line:#3b4252;
  --display:"Spectral SC", Georgia, serif;--serif:"Spectral", Georgia, serif;
  --ui:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--ui);display:flex;flex-direction:column;overflow:hidden}
button{font:500 13px var(--ui);color:var(--text);background:var(--ink-2);border:1px solid #334055;border-radius:7px;padding:7px 12px;cursor:pointer}
button:hover{border-color:#4d5b74}
button:focus-visible,input:focus-visible,.row:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);color:#1b1608;border-color:var(--accent);font-weight:600}
/* header */
header.bar{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule);position:relative;z-index:30}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.05em;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px;position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--ink-2);border:1px solid #334055;border-radius:10px;padding:6px;min-width:230px;box-shadow:0 14px 34px rgba(0,0,0,.5)}
.pop[hidden]{display:none}
.pop label{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:9px 10px;border-radius:6px;font-size:14px;cursor:pointer}
.pop label:hover{background:var(--ink-3)}
.pop label span small{display:block;color:var(--muted);font-size:12px}
.pop input{appearance:none;-webkit-appearance:none;flex:none;width:36px;height:21px;border-radius:999px;background:#3a4558;position:relative;cursor:pointer;transition:background .15s;margin:0}
.pop input::after{content:"";position:absolute;top:2.5px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.pop input:checked{background:var(--accent)}.pop input:checked::after{transform:translateX(14px)}
/* map */
main{position:relative;flex:1;min-height:0;display:flex}
#wrap{position:relative;flex:1;min-width:0;touch-action:none;overflow:hidden}
svg#map{width:100%;height:100%;display:block;cursor:grab;user-select:none;-webkit-user-select:none}
svg#map.dragging{cursor:grabbing}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;border:1px solid #334055;border-radius:9px;overflow:hidden;background:rgba(27,35,48,.92);box-shadow:0 6px 18px rgba(0,0,0,.35)}
.zoom button{width:38px;height:38px;padding:0;font-size:18px;border:0;border-radius:0;background:transparent}
.zoom button+button{border-top:1px solid #334055}
.zoom button:hover{background:var(--ink-3)}
#tip{position:absolute;left:0;top:0;pointer-events:none;background:rgba(18,24,34,.95);border:1px solid #334055;padding:7px 10px;border-radius:7px;font-size:13px;white-space:nowrap;display:none;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.35)}
#tip b{font-family:var(--display);font-weight:600;letter-spacing:.04em;font-size:14px}
#tip span{color:var(--muted);display:block;font-family:var(--mono);font-size:12px;margin-top:2px}
.region,.feat{outline:none}
.feat{cursor:pointer}
.feat:hover path{stroke:#b07a12;stroke-width:2}
.region{cursor:pointer;transition:filter .2s}
.region:hover{filter:brightness(1.05) saturate(1.15)}
svg.focus .region:not(.on){filter:saturate(.35) brightness(1.06)}
svg.focus .region:not(.on):hover{filter:saturate(.7) brightness(1.06)}
.border{fill:none;stroke:var(--line);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round;pointer-events:none}
.border-under{fill:none;stroke:#fff;stroke-width:4.5;opacity:.55;stroke-linejoin:round;pointer-events:none}
.sel{fill:none;stroke:var(--accent);stroke-width:5;stroke-linejoin:round;pointer-events:none}
.lbl{font-family:var(--display);fill:#262b36;paint-order:stroke;stroke:rgba(255,255,255,.78);stroke-width:4px;stroke-linejoin:round;letter-spacing:.08em;text-anchor:middle;pointer-events:none;font-weight:600}
.dis{font:600 9.5px var(--ui);letter-spacing:.12em;fill:#7a2e3e;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:2.5px}
.note{font-family:var(--serif);font-style:italic;fill:#4a4f5c;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(255,255,255,.7);stroke-width:3px}
.mk circle{fill:#fff;stroke:#2c3240;stroke-width:1.6}
.mk text{font:600 15px var(--mono);fill:#1f2430;text-anchor:middle;dominant-baseline:central}
.mk,.tag{pointer-events:none}
.tag rect.o{fill:#fffdf7;stroke:#2c3240;stroke-width:1.4}
.tag .k{font:600 11px var(--ui);letter-spacing:.12em;fill:#555c6b}
.tag .v{font:600 17px var(--mono);fill:#1c212c}
.tag .me{font:500 12.5px var(--mono);fill:#2c3240}
.compass .cr-l{font:600 17px "Spectral SC",serif;fill:#2c3240;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em}
.compass .cr-l.n{font-size:22px;fill:#b0452f}
.grid line{stroke:#7d8699;stroke-width:.6;stroke-dasharray:2 7;opacity:.55}
.gridlbl{font:500 13px var(--mono);fill:#8f98aa;text-anchor:middle;dominant-baseline:central}
.hide-stats .tag,.hide-marks .mk,.hide-notes .note,.hide-notes .dis,.hide-grid .grid{display:none}
/* border editor */
#bEdit[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1b1608;font-weight:600}
#ebar{position:absolute;left:12px;right:64px;bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:rgba(27,35,48,.96);border:1px solid #3d4a62;border-radius:12px;padding:10px 12px;box-shadow:0 10px 28px rgba(0,0,0,.45);z-index:6;max-width:720px}
#ebar[hidden]{display:none}
.eb-t{flex:1 1 220px;min-width:0;font-size:13px;display:flex;flex-direction:column;gap:2px}
.eb-t span{color:var(--muted)}
.eb-r{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.eb-r input{width:110px;accent-color:var(--accent)}
.eb-b{display:flex;gap:6px}
.eb-b button:disabled{opacity:.45;cursor:default}
svg.editing{cursor:crosshair}
svg.editing .border{stroke:#b0452f;stroke-width:2.4}
svg.editing .region:hover{filter:none}
.bcur{fill:rgba(226,176,74,.12);stroke:#b07a12;stroke-width:1.5;stroke-dasharray:4 3;pointer-events:none}
@media (max-width:760px){#ebar{left:8px;right:8px;bottom:calc(var(--sheetpx,0px) + 8px)}.eb-t{flex-basis:100%}}
/* header menu */
.mb{display:none}
.pop.menu{min-width:250px}
.pop.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;font-size:14.5px;border-radius:6px}
.pop.menu button small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
.pop.menu button:hover{background:var(--ink-3)}
#bTime[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1b1608;font-weight:600}
/* relations on map */
.rel{pointer-events:none}
.rel .rl-u{fill:none;stroke:#fff;stroke-width:8;opacity:.85;stroke-linecap:round}
.rel .rl{fill:none;stroke-width:4;stroke-linecap:round}
.rel .war .rl{stroke:#c0392b;stroke-dasharray:14 10}
.rel .ally .rl{stroke:#2563eb}
.rel .rl-end{stroke:#fff;stroke-width:2}
.rel .war .rl-end,.rel .war .rl-mid{fill:#c0392b}
.rel .ally .rl-end,.rel .ally .rl-mid{fill:#2563eb}
.rel .rl-mid{stroke:#fff;stroke-width:2.5}
.rel .rl-ico{stroke:#fff;stroke-width:2.6;stroke-linecap:round}
.hide-rel .rel{display:none}
/* timeline bar */
#tbar{position:absolute;left:12px;right:64px;bottom:12px;background:rgba(27,35,48,.97);border:1px solid #3d4a62;border-radius:12px;padding:12px 14px 10px;box-shadow:0 10px 28px rgba(0,0,0,.45);z-index:6;max-width:760px;display:flex;flex-direction:column;gap:8px}
#tbar[hidden]{display:none}
.tb-top{display:flex;align-items:center;gap:8px}
.tb-t{flex:1;min-width:0;display:flex;flex-direction:column}
.tb-t b{font-family:var(--display);font-size:17px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-t span{font-size:12.5px;color:var(--muted)}
.tb-track{position:relative;padding:0 10px 26px}
.tb-track input{width:100%;accent-color:var(--accent);margin:6px 0}
#tbTicks{position:absolute;left:10px;right:10px;top:30px;height:22px}
#tbTicks button{position:absolute;transform:translateX(-50%);background:transparent;border:0;padding:2px 4px;font-size:11.5px;color:var(--muted);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
#tbTicks button:first-child{transform:none}#tbTicks button:last-child{transform:translateX(-100%)}
#tbTicks button.on{color:var(--accent);font-weight:600}
.tb-act{display:flex;gap:6px;flex-wrap:wrap}
.tb-act input{flex:1 1 180px;min-width:0;font:14px var(--ui);color:var(--text);background:var(--ink);border:1px solid #46526a;border-radius:8px;padding:8px 10px}
.tb-act input:focus{outline:none;border-color:var(--accent)}
.tb-hint{margin:0;font-size:12px;color:var(--muted)}
.x.sm{width:28px;height:28px;font-size:15px}
body.past #edStart,body.past #bEdit{display:none}
body.past svg#map{filter:sepia(.25)}
.pastnote{margin:0;font-size:13.5px;color:#d9c48f;background:rgba(226,176,74,.08);border:1px solid rgba(226,176,74,.3);border-radius:8px;padding:9px 11px}
/* relations panel */
.relform{display:flex;flex-direction:column;gap:10px;background:var(--ink);border:1px solid #2e3849;border-radius:10px;padding:12px}
.relpick{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.relpick select{font:15px var(--ui);color:var(--text);background:var(--ink-2);border:1px solid #46526a;border-radius:8px;padding:9px 10px}
.rels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.relrow{display:flex;align-items:center;gap:6px;background:var(--ink);border:1px solid #2e3849;border-left:4px solid;border-radius:8px;padding:6px 6px 6px 8px}
.relrow.war{border-left-color:#c0392b}.relrow.ally{border-left-color:#2563eb}
.relrow .rn{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:transparent;border:0;padding:4px;font-size:13.5px;text-align:left}
.relrow .rn:hover{color:var(--accent)}
.relrow .ri{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.chip.cw{border-color:#7a2a22;background:rgba(192,57,43,.12)}
.chip.ca{border-color:#264a8f;background:rgba(37,99,235,.12)}
.relsec h3{margin-bottom:6px}
/* rankings */
.seg .kd{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rk{background:var(--ink);border:1px solid #2e3849;border-radius:10px;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:7px}
.rk:hover{border-color:#4d5b74}
.rkh{display:flex;align-items:center;gap:8px;font-size:15px}
.rkh .rn{font:600 13px var(--mono);color:var(--muted);width:20px}
.rkh .nm2{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rkh .gv{font-size:11.5px;color:var(--muted);border:1px solid #334055;border-radius:999px;padding:1px 8px;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:4px}
.bars .b{display:grid;grid-template-columns:62px 1fr 34px;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.bars .b i{height:8px;background:#232c3b;border-radius:4px;overflow:hidden;display:block}
.bars .b s{display:block;height:100%;border-radius:4px}
.bars .b b{font:600 13px var(--mono);color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.bars .b.on span{color:var(--text);font-weight:600}
@media (max-width:760px){.tb-hint{display:none}#tbar{padding:10px 12px 8px;gap:6px}.dk{display:none}.mb{display:inline-block}#tbar{left:8px;right:8px;bottom:calc(var(--sheetpx,0px) + 8px)}}
/* layout refinements */
.ptog{position:absolute;right:0;top:50%;transform:translateY(-50%);width:22px;height:64px;padding:0;border-radius:9px 0 0 9px;border-right:0;background:var(--ink-2);display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:-4px 0 14px rgba(0,0,0,.3)}
.ptog svg{transition:transform .2s}
body.nopanel .ptog svg{transform:rotate(180deg)}
body.nopanel aside{display:none}
@media (max-width:1300px){.dk{display:none}.mb{display:inline-block}.brand small{display:none}}
.ihead{position:sticky;top:0;z-index:2;background:var(--ink-2);display:flex;flex-direction:column;gap:12px;margin:-16px -18px 0;padding:16px 18px 12px;border-bottom:1px solid var(--rule)}
.ihead .seg,.seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.ihead .seg button{padding:5px 9px}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none}
.list{gap:2px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 10px;border-bottom:0;border-radius:8px}
.row:hover{background:var(--ink-3)}
.row .sw2{width:10px;height:34px;border-radius:3px;border:1px solid rgba(0,0,0,.35)}
.row.lv1{margin-left:14px;padding-left:12px;border-left:2px solid #2e3849;border-radius:0 8px 8px 0}
.row.lv2{margin-left:28px;padding-left:12px;border-left:2px solid #2e3849;border-radius:0 8px 8px 0}
.row.lv1 .sw2,.row.lv2 .sw2{height:24px;width:8px}
.row .nm .n1{font:500 15px var(--ui);color:var(--text);margin:0;display:flex;align-items:center;gap:6px;min-width:0}
.row .nm .n1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.lv1 .nm .n1,.row.lv2 .nm .n1{font-size:14px;color:#cdd3de}
.row .nm .n2{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;font:inherit}
.row .nm .n2 span{font:500 11px var(--ui);letter-spacing:.02em;color:#aab3c3;background:var(--ink-3);border:1px solid #2f3a4d;border-radius:999px;padding:1px 8px}
.row .rv{width:auto;min-width:74px;text-align:right}
.row .rv b{font:600 17px var(--mono);font-variant-numeric:tabular-nums}
.row .rv small{display:block;font:11px var(--mono);color:var(--muted);margin-top:1px;white-space:nowrap}
.row .rv i{margin-top:5px}
.row .rv.na b{color:#5d6679;font-weight:500}
@media (max-width:760px){.ptog{display:none}.ihead{top:24px;margin:-4px -16px 0;padding:6px 16px 12px}}
/* characters */
.ccs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cc{display:flex;align-items:center;gap:12px;background:var(--ink);border:1px solid #2e3849;border-radius:12px;padding:8px 12px 8px 8px;cursor:pointer}
.cc:hover{border-color:#4d5b74}
.cc .ct{display:flex;flex-direction:column;min-width:0;gap:2px}
.cc .ct b{font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.03em}
.cc .ct span{font-size:12.5px;color:var(--muted)}
.cc .ct .cn{display:flex;align-items:center;gap:5px;color:#c3cad6}
.cc.sm{padding:5px 10px 5px 5px;border-radius:999px}
.cc.sm .ct b{font-size:15px}
.portrait{flex:none;display:block;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.chero{display:flex;gap:16px;align-items:center}
.chero .pill{display:inline-flex;align-items:center;gap:6px;background:var(--ink-3);border:1px solid #334055;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--text)}
.chero .meta{margin-top:8px}
.filebtn{font:500 13px var(--ui);color:var(--text);background:var(--ink-2);border:1px solid #334055;border-radius:7px;padding:7px 12px;cursor:pointer}
.filebtn:hover{border-color:#4d5b74}
.charform .cprev{display:flex;justify-content:center;padding:6px 0}
.charform .ch3{font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 0 0}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cf{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted)}
.cf input{-webkit-appearance:none;appearance:none;flex:none;width:40px!important;min-width:0;max-width:40px;height:40px;padding:0;border:2px solid #46526a;border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.cf input::-webkit-color-swatch-wrapper{padding:0}.cf input::-webkit-color-swatch{border:0;border-radius:50%}.cf input::-moz-color-swatch{border:0;border-radius:50%}
.gf select,.gf textarea{font:15px var(--ui);color:var(--text);background:var(--ink);border:1px solid #46526a;border-radius:8px;padding:9px 11px}
.gf textarea{font-family:var(--serif);line-height:1.5;resize:vertical}
.gov .rb{display:inline-flex;align-items:center;gap:8px;background:transparent;border:0;padding:0;font:inherit;color:var(--text);cursor:pointer;text-decoration:underline;text-decoration-color:#4d5b74;text-underline-offset:3px}
.gov .rb:hover{text-decoration-color:var(--accent)}
/* panel */
aside{width:clamp(330px,30vw,400px);flex:none;background:var(--ink-2);border-left:1px solid var(--rule);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column}
.grab{display:none}
#pb{padding:16px 18px 28px;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;gap:12px;align-items:flex-start}
.ph .sw{width:14px;align-self:stretch;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.35)}
.ph .t{flex:1;min-width:0}
h2{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:.04em;margin:0;line-height:1.15;text-wrap:balance}
.meta{font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.meta .pill{display:inline-flex;align-items:center;gap:5px;background:var(--ink-3);border:1px solid #334055;border-radius:999px;padding:2px 9px;color:var(--text);font-size:12.5px}
.meta button.pill{cursor:pointer}
.meta .pill.warn{background:rgba(120,140,60,.18);border-color:#6f7f3e;color:#cfdca0}
.meta button.pill:hover{border-color:var(--accent)}
.x{width:34px;height:34px;padding:0;font-size:18px;line-height:1;flex:none;border-radius:50%}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--ink);border:1px solid #2e3849;border-radius:10px;padding:10px 11px}
.stat .k{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between;gap:6px}
.stat .k em{font-style:normal;letter-spacing:0;text-transform:none;color:#7f899c}
.stat .v{font:600 24px var(--mono);font-variant-numeric:tabular-nums;margin-top:3px}
.stat .bar{height:4px;background:#2a3344;border-radius:2px;margin-top:7px;overflow:hidden}
.stat .bar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.stat.na .v{color:#5d6679}
.erow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.erow .edited{font-size:12px;color:var(--muted)}
.editor{display:flex;flex-direction:column;gap:10px}
.editor .stat{display:flex;flex-direction:column;gap:4px;border-color:#4d5b74}
.editor input{width:100%;font:600 22px var(--mono);color:var(--text);background:transparent;border:0;border-bottom:1px solid #46526a;padding:2px 0;outline:none}
.editor input:focus{border-bottom-color:var(--accent)}
.savest{font-size:12.5px;color:var(--accent)}
.gov dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:0;border:1px solid #2e3849;border-radius:10px;overflow:hidden;background:var(--ink)}
.gov .gr{display:contents}
.gov dt,.gov dd{margin:0;padding:9px 12px;border-bottom:1px solid #263042;font-size:14px}
.gov .gr:last-child dt,.gov .gr:last-child dd{border-bottom:0}
.gov dt{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;align-self:center}
.gov dd{font-family:var(--serif);font-size:15.5px}
.gov .gtype{font-family:var(--ui);font-weight:600;font-size:13px;letter-spacing:.03em;background:var(--ink-3);border:1px solid #3d4a62;border-radius:999px;padding:2px 10px}
.gov .ns{color:#6c7689;font-style:italic}
.gov .erow{margin-top:8px}
.gov .inh{font-size:13.5px;color:var(--muted);margin:0 0 8px;font-family:var(--ui);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.gov .inh .pill{display:inline-flex;align-items:center;gap:5px;background:var(--ink-3);border:1px solid #334055;border-radius:999px;padding:2px 9px;font-size:12.5px}
.gf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.gf input{font:15px var(--ui);color:var(--text);background:var(--ink);border:1px solid #46526a;border-radius:8px;padding:9px 11px}
.gf input:focus{outline:none;border-color:var(--accent)}
.gf small{display:flex;gap:8px;align-items:center;flex-wrap:wrap;letter-spacing:0}
.flag{display:inline-flex;flex-direction:column;width:20px;height:13px;border:1px solid rgba(0,0,0,.5);border-radius:2px;overflow:hidden;vertical-align:-2px;margin-left:8px}
.flag i{flex:1}
.flag.big{width:42px;height:27px;margin-left:0;border-radius:3px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.lore textarea{width:100%;min-height:150px;resize:vertical;font:15px/1.5 var(--serif);color:var(--text);background:var(--ink);border:1px solid #46526a;border-radius:8px;padding:10px 12px}
.lore textarea:focus{outline:none;border-color:var(--accent)}
.savest:empty{display:none}
.sec h3{font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.sec p,.sec li{font-family:var(--serif);font-size:15px;line-height:1.5;margin:0}
.sec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.caps{display:flex;flex-wrap:wrap;gap:8px}
.cap{display:flex;align-items:center;gap:8px;background:var(--ink);border:1px solid #2e3849;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px}
.cap small{color:var(--muted)}
.circ{display:inline-flex;flex:none;width:28px;height:28px;border-radius:50%;background:#fff;color:#1f2430;border:1.5px solid #2c3240;align-items:center;justify-content:center;font:600 13px var(--mono)}
.circ.sm{width:21px;height:21px;font-size:11px;margin:3.5px}
.circ.x2{background:repeating-linear-gradient(45deg,#fff 0 3px,#c9ccd4 3px 4px)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:500 13px var(--ui);background:var(--ink);border:1px solid #334055;border-radius:999px;padding:5px 11px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;gap:6px}
.chip:hover{border-color:var(--accent)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.35);flex:none}
.lore{border-left:3px solid var(--accent);padding:9px 12px;background:rgba(226,176,74,.07);border-radius:0 8px 8px 0}
.lore p{color:#c9cfdb}
.empty{color:var(--muted);font-family:var(--serif);font-style:italic}
/* index */
.search{position:relative}
.search input{width:100%;font:15px var(--ui);color:var(--text);background:var(--ink);border:1px solid #334055;border-radius:9px;padding:10px 12px 10px 34px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.6}
.seg{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.seg span{font-size:12px;color:var(--muted);margin-right:4px}
.seg button{padding:5px 10px;font-size:12.5px;border-radius:999px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1b1608;font-weight:600}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid #263042;cursor:pointer;border-radius:6px}
.row:hover{background:var(--ink-3)}
.row.t{padding-left:22px}
.row.t .nm{font-size:14px}
.row .nm{flex:1;min-width:0;font-size:15px}
.row .nm div{font:12px var(--mono);color:var(--muted);margin-top:2px}
.row .rv{width:84px;flex:none;text-align:right;font:600 16px var(--mono);font-variant-numeric:tabular-nums}
.row .rv i{display:block;height:3px;background:#2a3344;border-radius:2px;margin-top:5px;overflow:hidden}
.row .rv i s{display:block;height:100%;background:var(--accent)}
.row .rv.na{color:#5d6679}
.row .tri{color:#5d6679;font-size:12px;margin-right:-4px}
details.key{border-top:1px solid var(--rule);padding-top:12px}
details.key summary{cursor:pointer;font:600 11px var(--ui);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
details.key ul{margin:10px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:5px;font-size:14px;line-height:1.45}
.noresult{color:var(--muted);font-style:italic;font-family:var(--serif);padding:10px 6px}
@media (max-width:760px){
  header.bar{padding:8px 12px}
  .brand h1{font-size:15px}
  .tools{gap:5px}.tools>button{padding:6px 9px;font-size:12.5px}
  .brand small{display:none}
  aside{position:absolute;left:0;right:0;bottom:0;width:auto;height:var(--sheet,42%);border-left:0;border-top:1px solid var(--rule);border-radius:16px 16px 0 0;box-shadow:0 -12px 30px rgba(0,0,0,.45);transition:height .25s ease;z-index:10}
  aside.drag{transition:none}
  .grab{display:block;position:sticky;top:0;z-index:2;background:var(--ink-2);height:24px;flex:none;cursor:grab;touch-action:none;border:0;border-radius:16px 16px 0 0;padding:0;width:100%}
  .grab::before{content:"";display:block;width:42px;height:5px;border-radius:3px;background:#4a566c;margin:9px auto 0}
  #pb{padding:4px 16px 24px;gap:14px}
  h2{font-size:21px}
  .zoom{top:10px;right:10px}
}
@media (prefers-reduced-motion:reduce){.region,aside{transition:none}}

<header class="bar">

      <button type="button" data-act="chars">Characters<small>Rulers and heroes with portraits</small></button>

    </div>

      <label for="tMarks"><span>Capitals<small>Size = population, number = infrastructure</small></span><input id="tMarks" type="checkbox" checked=""></label>
      <label for="tNotes"><span>Notes &amp; disputes<small>Map notes and DIS tags</small></span><input id="tNotes" type="checkbox" checked=""></label>
      <label for="tRel"><span>Wars &amp; alliances<small>Red dashed = war, blue = alliance</small></span><input id="tRel" type="checkbox" checked=""></label>

</header>

function rankOf(r,k){const v=r.stats?.[k];if(v==null)return null;const vals=R.map(x=>x.stats?.[k]).filter(x=>x!=null);return{rank:1+vals.filter(x=>x>v).length,of:vals.length}}

  return`<div class="stat${na?" na":""}"><div class="k">${label}${rk?`<em>#${rk.rank}</em>`:""}</div><div class="v">${na?"—":v}</div><div class="bar"><i style="width:${na?0:Math.round(v/MAX[k]*100)}%"></i></div></div>`}

(()=>{const g=document.getElementById("grab");let y0=null,h0=0,moved=0;
  g.addEventListener("pointerdown",e=>{y0=e.clientY;h0=panel.getBoundingClientRect().height;moved=0;g.setPointerCapture(e.pointerId);panel.classList.add("drag")});
  g.addEventListener("pointermove",e=>{if(y0==null)return;const H=panel.parentElement.clientHeight;moved=Math.max(moved,Math.abs(e.clientY-y0));
    panel.style.setProperty("--sheet",Math.min(.96,Math.max(.18,(h0-(e.clientY-y0))/H))*100+"%")});
  const end=e=>{if(y0==null)return;panel.classList.remove("drag");const H=panel.parentElement.clientHeight,f=panel.getBoundingClientRect().height/H;y0=null;
    if(moved<6){setSheet({min:"peek",mini:"peek",peek:"half",half:"full",full:"min"}[sheet]);return}
    setSheet(Object.keys(SHEET).reduce((a,b)=>Math.abs(SHEET[b]-f)<Math.abs(SHEET[a]-f)?b:a))};
  g.addEventListener("pointerup",end);g.addEventListener("pointercancel",end);})();

let sortKey="rate",query="";
const SORTS=[["rate","Rate"],["m","Military"],["e","Economy"],["caps","Capitals"],["name","A–Z"]];
function sval(r){return sortKey==="name"?r.name:sortKey==="caps"?caps(r).length:(r.stats?.[sortKey]??-1)}
const cmp=(a,b)=>sortKey==="name"?a.name.localeCompare(b.name):(sval(b)-sval(a))||a.name.localeCompare(b.name);
function rowHTML(r,isT){const lvl=isT===true?1:isT||0;
  const key=sortKey==="name"||sortKey==="caps"?"rate":sortKey,st=r.stats||{};
  const v=sortKey==="caps"?(caps(r).length||null):st[key];
  const mx=sortKey==="caps"?Math.max(1,...R.map(x=>caps(x).length)):MAX[key];
  const lbl={rate:"R",m:"M",e:"E"},others=["rate","m","e"].filter(k=>k!==key&&st[k]!=null).map(k=>`${lbl[k]} ${st[k]}`).join(" · ");
  const nc=caps(r).length,tags=[GOV[r.id]?.gov,nc?`${nc} capital${nc>1?"s":""}`:null,r.tag,r.kind?"Resistance":null,r.of&&!r.kind?"Territory":null].filter(Boolean);
  return`<li class="row lv${lvl}" data-go="${r.id}" tabindex="0"><span class="sw2" style="background:${r.fill}"></span>
    <div class="nm"><div class="n1"><span>${esc(r.name)}</span>${flagHTML(GOV[r.id]?.flag)}</div>${tags.length?`<div class="n2">${tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div>`:""}</div>
    <div class="rv${v==null?" na":""}"><b>${v??"—"}</b>${others&&sortKey!=="caps"?`<small>${others}</small>`:""}<i><s style="width:${v==null?0:Math.round(v/mx*100)}%"></s></i></div></li>`}
function listHTML(){
  if(query){const q=query.toLowerCase(),hits=R.filter(r=>r.name.toLowerCase().includes(q)||r.asWritten.toLowerCase().includes(q)).sort(cmp);
    return hits.length?hits.map(r=>rowHTML(r,false)).join(""):`<li class="noresult">No nation matches “${esc(query)}”.</li>`}
  const res=(id,l)=>R.filter(x=>x.in===id).map(x=>rowHTML(x,l)).join("");
  return R.filter(r=>!r.of&&!r.kind).sort(cmp).map(r=>rowHTML(r,0)+res(r.id,1)+terr(r.id).sort(cmp).map(t=>rowHTML(t,1)+res(t.id,2)).join("")).join("")}

let artifactApi=null;

function sub(b,m1,m2,val){const i=b.indexOf(m1),j=b.indexOf(m2,i);return b.slice(0,i+m1.length)+val+b.slice(j)}
async function persist(what){
  let body=sub(SRC.body,"/*ED"+"ITS*/","/*E"+"ND*/",JSON.stringify(EDITS));
  body=sub(body,"/*BOR"+"DERS*/","/*BE"+"ND*/",JSON.stringify(BORDERS));
  body=sub(body,"/*LO"+"RE*/","/*LE"+"ND*/",JSON.stringify(LORE).replace(/</g,"\\u003c"));
  body=sub(body,"/*G"+"OV*/","/*GE"+"ND*/",JSON.stringify(GOV).replace(/</g,"\\u003c"));
  body=sub(body,"/*R"+"EL*/","/*R"+"ND*/",JSON.stringify(REL));
  body=sub(body,"/*T"+"L*/","/*T"+"ND*/",JSON.stringify(TL).replace(/</g,"\\u003c"));
  body=sub(body,"/*C"+"H*/","/*CH"+"END*/",JSON.stringify(CHARS).replace(/</g,"\\u003c"));
  const html='<!DOCTYPE html>\n<html lang="en">\n<head>\n'+SRC.head+'\n</head>\n<body>\n'+body+'\n</body>\n</html>\n';
  if(!artifactApi)return"Changed for this visit only. Saving isn't available in this view.";
  try{await artifactApi.publish(html);return`Saved. Everyone with the link now sees the new ${what}.`}
  catch(err){const c=err&&(err.code||err.message||"")+"";return/not_granted|not_writer/.test(c)?"Only the map's owner can save changes.":/conflict/.test(c)?"Someone else saved first. The page will reload with their version.":"Couldn't save just now. Try again."}}

function brushCursor(e){if(e.pointerType!=="mouse"){bcur.setAttribute("visibility","hidden");return}const p=toSvg(e.clientX,e.clientY);
  bcur.setAttribute("cx",p.x);bcur.setAttribute("cy",p.y);bcur.setAttribute("r",brushPx()*pxScale());bcur.setAttribute("visibility","visible")}
function brushStart(e){const p=toSvg(e.clientX,e.clientY),sc=pxScale(),grab=Math.max(14,brushPx()*.45)*sc;let best=Infinity;
  for(const i of GEO.border){for(const q of GEO.arcs[i]){const d=Math.hypot(q[0]-p.x,q[1]-p.y);if(d<best)best=d}}
  if(best>grab)return false;
  brush={p0:p,R0:brushPx()*sc,maxR:0,snap:GEO.arcs.map(a=>a.map(q=>q.slice())),touched:new Set()};svg.classList.add("dragging");tip.style.display="none";return true}
function brushMove(e){const p=toSvg(e.clientX,e.clientY),dx=p.x-brush.p0.x,dy=p.y-brush.p0.y,R=Math.max(brush.R0,Math.hypot(dx,dy)*1.6),scan=Math.max(R,brush.maxR);brush.maxR=scan;
  brush.snap.forEach((sa,i)=>{const a=GEO.arcs[i];let hit=false;
    for(let j=0;j<sa.length;j++){const x=sa[j][0],y=sa[j][1],d=Math.hypot(x-brush.p0.x,y-brush.p0.y);if(d>=scan)continue;hit=true;
      if(d>=R){a[j]=[x,y];continue}const t=1-(d/R)**2,w=t*t;
      const onV=Math.abs(x-X0)<.6||Math.abs(x-X1)<.6,onH=Math.abs(y-Y0)<.6||Math.abs(y-Y1)<.6;
      let nx=onV?x:x+dx*w,ny=onH?y:y+dy*w;nx=Math.min(X1,Math.max(X0,nx));ny=Math.min(Y1,Math.max(Y0,ny));a[j]=[+nx.toFixed(1),+ny.toFixed(1)]}
    if(hit)brush.touched.add(i)});
  if(!brush.raf)brush.raf=requestAnimationFrame(()=>{if(!brush)return;brush.raf=0;redrawArcs([...brush.touched])})}
function redrawArcs(list){const regs=new Set();
  for(const i of list){if(borderEls[i])borderEls[i].forEach(p=>p.setAttribute("d",arcD(i)));(arcOwners[i]||[]).forEach(id=>regs.add(id))}
  for(const id of regs){const r=byId[id];r.d=GEO.geoms[r.id].map(ringPath).join("")+(r.extra||[]).map(p=>"M"+p.map(fmt).join("L")+"Z").join("");r.els.forEach(p=>p.setAttribute("d",r.d))}

  const changed=t.filter(i=>GEO.arcs[i].some((q,j)=>q[0]!==b.snap[i][j][0]||q[1]!==b.snap[i][j][1]));

document.getElementById("ebUndo").onclick=()=>{const u=undo.pop();if(!u)return;for(const i in u)GEO.arcs[+i]=u[i];redrawArcs(Object.keys(u).map(Number));document.getElementById("ebUndo").disabled=!undo.length;scheduleSave()};

const tlPast=()=>tlPos<TL.length-.001;
const tlIdx=()=>Math.max(0,Math.min(TL.length-1,Math.round(tlPos)));
const allArcIdx=GEO.arcs.map((_,i)=>i);
const stopArcs=k=>k>=TL.length?LIVE_ARCS:ORIG_ARCS.map((a,i)=>(TL[k].borders||{})[i]||a);

function showState(pos,final){const n=TL.length;pos=Math.max(0,Math.min(n,pos));tlPos=pos;const k=Math.floor(pos),f=pos-k;
  if(f<.001||k>=n)GEO.arcs=stopArcs(Math.round(pos));
  else{const A=stopArcs(k),B=stopArcs(k+1);GEO.arcs=A.map((a,i)=>{const b=B[i];if(a===b||a.length!==b.length)return f<.5?a:b;return a.map((p,j)=>[p[0]+(b[j][0]-p[0])*f,p[1]+(b[j][1]-p[1])*f])})}
  redrawArcs(allArcIdx);const near=Math.round(pos),st=near>=n?{edits:EDITS,rel:REL}:TL[near];
  applyEdits(st.edits||{});calcMax();drawTags();drawRel(st.rel||[]);
  if(!tlPast())GEO.arcs=LIVE_ARCS;
  document.body.classList.toggle("past",tlPast());tbUI();
  if(final){if(current)select(current);else if(view==="rank")showRankings();else if(view==="rel")showRelations();else if(view==="index")showIndex()}}

  document.getElementById("tbSub").textContent=n?(atNow?`Live map · ${n} saved moment${n>1?"s":""}`:`Moment ${near+1} of ${n} · editing is off`):"No saved moments yet";

const HEAD=[["none","None"],["crown","Crown"],["cap","Military cap"],["helmet","Helmet"],["hood","Hood"],["laurel","Laurel wreath"],["circlet","Circlet"]];
const FACE=[["none","Clean-shaven"],["beard","Beard"],["moustache","Moustache"],["scar","Scar"]];
const PDEF={skin:"#e2b48f",hair:"#3b2a20",outfit:"#2f3e63",accent:"#d4a73a",bg:"#cfd6e4",hairStyle:"short",head:"none",face:"none"};
let pid=0;
function portrait(c,size){const p=Object.assign({},PDEF,c.look||{}),u="p"+(++pid);
  if(c.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(c.photo))return`<svg class="portrait" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="Portrait of ${esc(c.name||"character")}"><defs><clipPath id="${u}"><circle cx="50" cy="50" r="48"/></clipPath></defs><image href="${c.photo}" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#${u})"/><circle cx="50" cy="50" r="48" fill="none" stroke="${p.accent}" stroke-width="3"/></svg>`;
  const dk=h=>{try{const n=parseInt(h.slice(1),16);return"rgb("+[n>>16,n>>8&255,n&255].map(v=>Math.round(v*.72)).join(",")+")"}catch(e){return h}};
  let back="",front="",hat="",face="";
  if(p.hairStyle==="long")back=`<path d="M30,40 C28,20 72,20 70,40 L74,78 C64,84 36,84 26,78Z" fill="${p.hair}"/>`;
  if(p.hairStyle==="short")front=`<path d="M32,42 C30,22 70,22 68,42 C66,34 58,30 50,30 C42,30 34,34 32,42Z" fill="${p.hair}"/>`;
  if(p.hairStyle==="long")front=`<path d="M32,44 C30,22 70,22 68,44 C64,33 56,29 50,29 C44,29 36,33 32,44Z" fill="${p.hair}"/>`;
  if(p.hairStyle==="swept")front=`<path d="M31,40 C30,20 72,18 70,38 C64,30 54,27 44,30 C38,32 34,35 31,40Z" fill="${p.hair}"/><path d="M40,28 C50,22 62,24 68,32" stroke="${dk(p.hair)}" stroke-width="1.2" fill="none"/>`;
  if(p.hairStyle==="bun")front=`<circle cx="50" cy="19" r="7" fill="${p.hair}"/><path d="M32,42 C30,23 70,23 68,42 C65,33 57,29 50,29 C43,29 35,33 32,42Z" fill="${p.hair}"/>`;
  if(p.face==="beard")face=`<path d="M34,48 C35,64 44,70 50,70 C56,70 65,64 66,48 C62,58 56,60 50,60 C44,60 38,58 34,48Z" fill="${p.hair}"/>`;
  if(p.face==="moustache")face=`<path d="M42,55 C46,52 49,53 50,55 C51,53 54,52 58,55 C54,57 52,56 50,56 C48,56 46,57 42,55Z" fill="${p.hair}"/>`;
  if(p.face==="scar")face=`<path d="M58,36 L63,50" stroke="#8a3b3b" stroke-width="1.6" stroke-linecap="round"/><path d="M59,40l3,-1M60,44l3,-1" stroke="#8a3b3b" stroke-width="1"/>`;
  if(p.head==="crown")hat=`<path d="M33,30 L35,15 L42,23 L50,11 L58,23 L65,15 L67,30Z" fill="${p.accent}" stroke="${dk(p.accent)}" stroke-width="1.2"/><circle cx="50" cy="24" r="2.2" fill="#b3263b"/><rect x="33" y="27" width="34" height="4" fill="${dk(p.accent)}"/>`;
  if(p.head==="cap")hat=`<path d="M30,31 C30,17 70,17 70,31Z" fill="${p.outfit}"/><rect x="29" y="29" width="42" height="5" rx="2" fill="${dk(p.outfit)}"/><path d="M33,34 L67,34 L60,38 L40,38Z" fill="#1e1e22"/><circle cx="50" cy="25" r="3" fill="${p.accent}"/>`;
  if(p.head==="helmet")hat=`<path d="M29,40 C28,16 72,16 71,40 L66,40 C64,28 36,28 34,40Z" fill="${p.accent}" stroke="${dk(p.accent)}" stroke-width="1.2"/><rect x="48" y="30" width="4" height="22" rx="1.5" fill="${dk(p.accent)}"/><path d="M50,14 C56,8 62,10 64,16" stroke="#9b2d2d" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  if(p.head==="hood")hat=`<path d="M25,62 C22,24 78,24 75,62 L68,62 C70,36 30,36 32,62Z" fill="${p.outfit}" stroke="${dk(p.outfit)}" stroke-width="1"/>`;
  if(p.head==="laurel")hat=[0,1,2,3,4].map(i=>`<ellipse cx="${34+i*2.2}" cy="${36-i*3.6}" rx="2.4" ry="4.6" transform="rotate(${-40+i*8} ${34+i*2.2} ${36-i*3.6})" fill="#5a8f3e"/><ellipse cx="${66-i*2.2}" cy="${36-i*3.6}" rx="2.4" ry="4.6" transform="rotate(${40-i*8} ${66-i*2.2} ${36-i*3.6})" fill="#5a8f3e"/>`).join("");
  if(p.head==="circlet")hat=`<path d="M32,33 C40,29 60,29 68,33" stroke="${p.accent}" stroke-width="2.6" fill="none"/><path d="M50,27 l3,4 l-3,4 l-3,-4Z" fill="${p.accent}" stroke="${dk(p.accent)}" stroke-width=".8"/>`;
  return`<svg class="portrait" width="${size}" height="${size}" viewBox="0 0 100 100" role="img" aria-label="Portrait of ${esc(c.name||"character")}"><defs><clipPath id="${u}"><circle cx="50" cy="50" r="48"/></clipPath></defs>
  <g clip-path="url(#${u})"><rect width="100" height="100" fill="${p.bg}"/><circle cx="50" cy="50" r="40" fill="#fff" opacity=".18"/>${back}
  <path d="M8,104 C8,78 28,70 50,70 C72,70 92,78 92,104Z" fill="${p.outfit}"/>
  <path d="M40,70 L50,86 L60,70" fill="none" stroke="${p.accent}" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="68" cy="84" r="3.4" fill="${p.accent}" stroke="${dk(p.accent)}" stroke-width=".8"/>
  <rect x="44" y="58" width="12" height="14" fill="${dk(p.skin)}"/>
  <ellipse cx="50" cy="45" rx="17" ry="20" fill="${p.skin}"/>
  <ellipse cx="33" cy="47" rx="3" ry="4.5" fill="${p.skin}"/><ellipse cx="67" cy="47" rx="3" ry="4.5" fill="${p.skin}"/>
  ${face}
  <path d="M40,40 L46,39 M54,39 L60,40" stroke="${p.hair}" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="43.5" cy="45" rx="1.9" ry="2.3" fill="#23202a"/><ellipse cx="56.5" cy="45" rx="1.9" ry="2.3" fill="#23202a"/>
  <path d="M50,47 L48.5,53 L51,53" stroke="${dk(p.skin)}" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  ${p.face==="beard"?"":`<path d="M45.5,58 C48,59.5 52,59.5 54.5,58" stroke="#8a4f45" stroke-width="1.5" fill="none" stroke-linecap="round"/>`}
  ${front}${hat}</g><circle cx="50" cy="50" r="48" fill="none" stroke="${dk(p.bg)}" stroke-width="2"/></svg>`}
let charEditing=null,charMsg="";
const charById=id=>CHARS.find(c=>c.id===id);
function charCard(c,small){const n=byId[c.nation];return`<li class="cc${small?" sm":""}" data-char="${c.id}" tabindex="0">${portrait(c,small?44:64)}<div class="ct"><b>${esc(c.name)}</b>${c.title?`<span>${esc(c.title)}</span>`:""}${n&&!small?`<span class="cn">${dot(n)}${esc(n.name)}</span>`:""}</div></li>`}
function charsHTMLFor(id){const cs=CHARS.filter(c=>c.nation===id);
  return`<div class="sec"><h3>Characters</h3>${cs.length?`<ul class="ccs">${cs.map(c=>charCard(c,true)).join("")}</ul>`:"<p class='empty'>No characters yet.</p>"}<div class="erow" style="margin-top:8px"><button type="button" data-newchar="${id}">Add character</button></div></div>`}
function showChars(){view="chars";current=null;curChar=null;if(document.body.classList.contains("nopanel"))setPanel(true);selPath.setAttribute("d","");svg.classList.remove("focus");
  gRegions.querySelectorAll(".region.on").forEach(g=>g.classList.remove("on"));
  const groups=[...R].filter(r=>CHARS.some(c=>c.nation===r.id)).sort((a,b)=>a.name.localeCompare(b.name)),loose=CHARS.filter(c=>!byId[c.nation]);
  pb.innerHTML=`<div class="ph"><div class="t"><h2>Characters</h2><div class="meta">${CHARS.length} character${CHARS.length===1?"":"s"} · rulers, generals and heroes</div></div><button type="button" class="x" id="back" aria-label="Back to all nations">×</button></div>
   <div class="erow"><button type="button" class="primary" data-newchar="">Add character</button></div>
   ${groups.map(r=>`<div class="sec"><h3>${dot(r)} ${esc(r.name)}</h3><ul class="ccs">${CHARS.filter(c=>c.nation===r.id).map(c=>charCard(c)).join("")}</ul></div>`).join("")}
   ${loose.length?`<div class="sec"><h3>No nation</h3><ul class="ccs">${loose.map(c=>charCard(c)).join("")}</ul></div>`:""}
   ${CHARS.length?"":"<p class='empty'>No characters yet. Tap Add character to create one.</p>"}`;
  panel.scrollTop=0;if(mq.matches)setSheet("full")}
let curChar=null;
function lookFields(p){const col=(k,l)=>`<label class="cf"><span>${l}</span><input type="color" id="cl-${k}" value="${p[k]}"></label>`,sel=(k,l,opts)=>`<label class="gf"><span>${l}</span><select id="cl-${k}">${opts.map(([v,t])=>`<option value="${v}"${p[k]===v?" selected":""}>${t}</option>`).join("")}</select></label>`;
  return`<div class="cols">${col("skin","Skin")}${col("hair","Hair")}${col("outfit","Outfit")}${col("accent","Accent")}${col("bg","Background")}</div>${sel("hairStyle","Hairstyle",HAIR)}${sel("head","Headwear",HEAD)}${sel("face","Face",FACE)}`}
function showChar(cid,editNew){const c=editNew||charById(cid);if(!c){showChars();return}view="char";curChar=c.id;current=null;if(document.body.classList.contains("nopanel"))setPanel(true);
  const n=byId[c.nation];if(n&&!editNew){selPath.setAttribute("d",n.d);svg.classList.add("focus");gRegions.querySelectorAll(".region").forEach(g=>g.classList.toggle("on",g.dataset.id===n.id))}
  if(charEditing===c.id){const p=Object.assign({},PDEF,c.look||{});if(draftPhoto===undefined)draftPhoto=c.photo||null;
    const opts=[...R].sort((a,b)=>a.name.localeCompare(b.name)).map(r=>`<option value="${r.id}"${c.nation===r.id?" selected":""}>${esc(r.name)}</option>`).join("");
    pb.innerHTML=`<div class="ph"><div class="t"><h2>${editNew?"New character":"Edit character"}</h2></div><button type="button" class="x" id="charCancel" aria-label="Cancel">×</button></div>
     <form id="charForm" class="editor charform"><div class="cprev" id="cprev">${portrait(c,120)}</div>
      <label class="gf"><span>Name</span><input id="cf-name" type="text" value="${esc(c.name||"")}" placeholder="e.g. Shero" required></label>
      <label class="gf"><span>Title</span><input id="cf-title" type="text" value="${esc(c.title||"")}" placeholder="e.g. Dictator of the Sherolean Empire"></label>
      <label class="gf"><span>Nation</span><select id="cf-nation"><option value="">No nation</option>${opts}</select></label>
      <h3 class="ch3">Photo</h3>
      <div class="erow"><label class="filebtn" for="cf-photo">${c.photo?"Change photo":"Upload photo"}</label><input id="cf-photo" type="file" accept="image/*" hidden>${c.photo?`<button type="button" id="cf-nophoto">Use drawn portrait</button>`:""}</div>
      <p class="meta" style="margin:0">A photo replaces the drawn portrait. It's cropped to a circle and shrunk to keep the map fast.</p>
      <h3 class="ch3">Drawn portrait</h3>${lookFields(p)}
      <label class="gf"><span>Biography</span><textarea id="cf-bio" rows="6" placeholder="Who are they? What have they done? Leave a blank line between paragraphs.">${esc((c.bio||[]).join("\n\n"))}</textarea></label>
      <div class="erow"><button type="submit" class="primary">Save character</button><button type="button" id="charCancel2">Cancel</button>${editNew?"":`<button type="button" id="charDel">Delete</button>`}</div></form>`;
    panel.scrollTop=0;if(mq.matches)setSheet("full");return}
  pb.innerHTML=`<div class="ph"><div class="t"><h2>${esc(c.name)}</h2><div class="meta">${c.title?`<span>${esc(c.title)}</span>`:""}</div></div><button type="button" class="x" id="charBack" aria-label="Back to characters">×</button></div>
   <div class="chero">${portrait(c,150)}<div>${n?`<button class="pill" data-go="${n.id}" type="button">${dot(n)}${esc(n.name)}</button>`:""}${n&&GOV[n.id]?.gov?`<p class="meta">${esc(GOV[n.id].gov)}</p>`:""}</div></div>
   <div class="erow"><button type="button" id="charEdit">Edit character</button></div><div class="savest" role="status">${charMsg}</div>
   <div class="sec lore"><h3>Biography</h3>${c.bio&&c.bio.length?c.bio.map(x=>`<p>${esc(x)}</p>`).join(""):"<p class='empty'>No biography yet. Tap Edit character to write one.</p>"}</div>
   ${n?`<div class="sec"><h3>Also from ${esc(n.name)}</h3>${CHARS.filter(x=>x.nation===n.id&&x.id!==c.id).length?`<ul class="ccs">${CHARS.filter(x=>x.nation===n.id&&x.id!==c.id).map(x=>charCard(x,true)).join("")}</ul>`:"<p class='empty'>No one else yet.</p>"}</div>`:""}`;
  panel.scrollTop=0;if(mq.matches&&sheet!=="full")setSheet("half")}
let draftChar=null;
let draftPhoto;
function readLook(){const g=k=>document.getElementById("cl-"+k)?.value;return{skin:g("skin"),hair:g("hair"),outfit:g("outfit"),accent:g("accent"),bg:g("bg"),hairStyle:g("hairStyle"),head:g("head"),face:g("face")}}
const prevC=()=>({name:document.getElementById("cf-name").value,look:readLook(),photo:draftPhoto});
pb.addEventListener("input",e=>{if(!e.target.id||!/^(cl-|cf-name)/.test(e.target.id))return;const pv=document.getElementById("cprev");if(pv)pv.innerHTML=portrait(prevC(),120)});
pb.addEventListener("change",e=>{if(e.target.id!=="cf-photo"||!e.target.files[0])return;const f=e.target.files[0],img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{const S=320,cv=document.createElement("canvas");cv.width=cv.height=S;const m=Math.min(img.width,img.height),cx=cv.getContext("2d");
    cx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);URL.revokeObjectURL(url);draftPhoto=cv.toDataURL("image/jpeg",.82);
    const pv=document.getElementById("cprev");if(pv)pv.innerHTML=portrait(prevC(),120)};img.src=url});
pb.addEventListener("change",e=>{if(e.target.id&&e.target.id.startsWith("cl-")){const pv=document.getElementById("cprev");if(pv)pv.innerHTML=portrait(prevC(),120)}});
pb.addEventListener("click",e=>{
  const cc=e.target.closest("[data-char]");if(cc){e.stopPropagation();charMsg="";charEditing=null;showChar(cc.dataset.char);return}
  const nc=e.target.closest("[data-newchar]");if(nc){e.stopPropagation();draftPhoto=undefined;draftChar={id:"c"+Date.now().toString(36),name:"",title:"",nation:nc.dataset.newchar||"",look:{...PDEF},bio:[]};charEditing=draftChar.id;showChar(null,draftChar);return}
  const id=e.target.closest("button")?.id;
  if(id==="cf-nophoto"){e.stopPropagation();draftPhoto=null;const pv=document.getElementById("cprev");if(pv)pv.innerHTML=portrait(prevC(),120);e.target.remove();return}
  if(id==="charEdit"){e.stopPropagation();draftPhoto=undefined;charEditing=curChar;charMsg="";showChar(curChar);return}
  if(id==="charBack"){e.stopPropagation();showChars();return}
  if(id==="charCancel"||id==="charCancel2"){e.stopPropagation();draftPhoto=undefined;const wasNew=draftChar&&charEditing===draftChar.id;charEditing=null;draftChar=null;if(wasNew)showChars();else showChar(curChar);return}
  if(id==="charDel"){e.stopPropagation();const b=e.target.closest("button");if(b.dataset.sure!=="1"){b.dataset.sure="1";b.textContent="Tap again to delete";setTimeout(()=>{b.dataset.sure="";b.textContent="Delete"},3000);return}
    const i=CHARS.findIndex(c=>c.id===curChar);if(i>=0)CHARS.splice(i,1);charEditing=null;showChars();persist("characters");return}},true);
pb.addEventListener("keydown",e=>{const cc=e.target.closest("li[data-char]");if(cc&&e.key==="Enter"){charEditing=null;showChar(cc.dataset.char)}});
pb.addEventListener("submit",async e=>{if(e.target.id!=="charForm")return;e.preventDefault();
  const v=k=>document.getElementById("cf-"+k).value.trim(),name=v("name");if(!name){document.getElementById("cf-name").focus();return}
  const data={name,title:v("title"),nation:document.getElementById("cf-nation").value,look:readLook(),bio:document.getElementById("cf-bio").value.replace(/\r/g,"").split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean)};
  let c=charById(charEditing);if(!c){c={id:charEditing};CHARS.push(c)}Object.assign(c,data);if(draftPhoto)c.photo=draftPhoto;else delete c.photo;draftPhoto=undefined;
  charEditing=null;draftChar=null;charMsg="Saving…";showChar(c.id);const m=await persist("characters");if(curChar===c.id&&view==="char"){charMsg=m;showChar(c.id)}});

document.getElementById("tbClose").onclick=()=>setTimeline(false);
showIndex();
requestAnimationFrame(()=>{vb=fitView(FULLBOX,1);setVB()});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(!current){vb=fitView(FULLBOX,1);setVB()}},150)});
</script>
</body>
</html>
